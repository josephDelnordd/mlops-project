rules:
  - id: ignore-msgpack
    description: Ignore msgpack vulnerability
    regex: "msgpack"
    severity: HIGH
    allow-rules:
      - id: ignore-msgpack
        description: Ignore msgpack vulnerability
        regex: "msgpack"
  - id: ignore-setuptools
    description: Ignore setuptools vulnerability
    regex: "setuptools"
    severity: HIGH
    allow-rules:
      - id: ignore-setuptools
        description: Ignore setuptools vulnerability
        regex: "setuptools"
