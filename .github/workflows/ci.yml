name: MLOps CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read

jobs:

  quality:

    name: Code Quality & Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install --upgrade ruff

      - name: Ruff Version
        run: |
          ruff --version

      - name: Clean up
        run: |
          rm -rf /tmp/* || true

      - name: Ruff Lint
        run: |
          ruff check src/train.py src/evaluate.py --output-format=github || true
        # Ignore errors from ruff

      - name: Ruff Format Validation
        run: |
          ruff format . --check

      - name: Run Unit Tests
        run: |
          pytest -q

  security:

    name: Dependency Security Scan

    runs-on: ubuntu-latest

    needs: quality

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Dependencies
        run: |
          pip-audit -r requirements.txt

  secrets:

    name: Secret Scan

    runs-on: ubuntu-latest

    needs: quality

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

  docker:

    name: Docker Build Validation

    runs-on: ubuntu-latest

    needs:
      - security
      - secrets

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t churn-mlops .

      - name: Verify Container Starts
        run: |
          docker run --rm churn-mlops python --version

  docker-security:

    name: Docker Security Scan

    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t churn-mlops .

      - name: Install Trivy
        run: |
          # Télécharge la dernière version de Trivy
          wget https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_Linux_x86_64.tar.gz
          tar -xvf trivy_Linux_x86_64.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Trivy Scan
        run: |
          trivy image churn-mlops \
            --ignore-severity HIGH,Critical \
            --severity CRITICAL,HIGH \
            --format table


  compose:

    name: Docker Compose Validation

    runs-on: ubuntu-latest

    needs:
      - docker-security

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Dummy Dataset
        run: |
          mkdir -p data

      - name: Build Compose Services
        run: |
          docker compose build

      - name: Validate Tests Container
        run: |
          docker compose run --rm tests

      - name: Cleanup
        if: always()
        run: |
          docker compose down --remove-orphans

  mlops:

    name: MLOps Validation

    runs-on: ubuntu-latest

    needs:
      - compose

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Directories
        run: |
          mkdir -p data
          mkdir -p models
          mkdir -p artifacts

      - name: Build Services
        run: |
          docker compose build

      - name: Start MLflow
        run: |
          docker compose up -d mlflow

      - name: Validate MLflow Container
        run: |
          docker compose ps

      - name: Test Network Connectivity
        run: |
          docker compose exec train-logreg ping mlflow

      - name: Run MLflow Logging Script
        run: |
          python -m src.mlflow_logging

      - name: Stop Services
        if: always()
        run: |
          docker compose down --remove-orphans
