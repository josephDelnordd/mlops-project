name: MLOps CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  code_quality:

    name: Code Quality Checks & Unit Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install --upgrade ruff

      - name: Ruff Version
        run: |
          ruff --version

      - name: Clean up
        run: |
          rm -rf /tmp/* || true

      - name: Ruff Lint
        run: |
          ruff check src/train.py src/evaluate.py --output-format=github || true
        # Ignore errors from ruff

      - name: Ruff Format Validation
        run: |
          ruff format . --check

      - name: Run Unit Tests
        run: |
          pytest -q

  dependency_security:

    name: Dependency Vulnerability Scan

    runs-on: ubuntu-latest

    needs: code_quality

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Dependencies
        run: |
          pip-audit -r requirements.txt

  secret_scan:

    name: Secret Detection Scan

    runs-on: ubuntu-latest

    needs: code_quality

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

  docker_build:

    name: Docker Image Build & Validation

    runs-on: ubuntu-latest

    needs:
      - dependency_security
      - secret_scan

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build --no-cache -t churn-mlops .

      - name: Verify Container Starts
        run: |
          docker run --rm churn-mlops python --version

  docker_compose:

    name: Docker Compose Services Validation

    runs-on: ubuntu-latest

    needs:
      - docker_build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Dummy Dataset
        run: |
          mkdir -p data

      - name: Build Compose Services
        run: |
          docker compose build

      - name: Validate Tests Container
        run: |
          docker compose run --rm tests

      - name: Cleanup
        if: always()
        run: |
          docker compose down --remove-orphans

  mlops_validation:

    name: MLOps Infrastructure Validation

    runs-on: ubuntu-latest

    needs:
      - docker_compose

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Required Directories
        run: |
          mkdir -p data
          mkdir -p models
          mkdir -p artifacts

      - name: Add Dummy Data File
        run: |
          mkdir -p data
          echo "feature1,feature2,label" > data/raw.csv
          echo "0,0,0" >> data/raw.csv
          echo "1,1,1" >> data/raw.csv

      - name: Build Compose Services
        run: |
          docker compose build

      - name: Start MLflow
        run: |
          docker compose up -d mlflow

      - name: Wait for MLflow
        run: |
          timeout 60 bash -c '
            until curl -fsS http://localhost:5000 > /dev/null; do
              sleep 2
            done
          '

      - name: Check MLflow Accessibility
        run: |
          curl -s http://mlflow:5000

      - name: Train Logistic Regression
        run: |
          docker compose run --rm train-logreg

      - name: Train Random Forest
        run: |
          docker compose run --rm train-rf

      - name: Evaluate Logistic Regression
        run: |
          docker compose run --rm evaluate-logreg

      - name: Evaluate Random Forest
        run: |
          docker compose run --rm evaluate-rf

      - name: Run MLflow Logging Script
        run: |
          python -m src.mlflow_logging

      - name: Display MLflow Logs
        if: always()
        run: |
          docker compose logs mlflow --tail=200

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans