name: MLOps CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# permissions for the workflow
permissions:
  contents: read

jobs:

  code_quality:

    name: Code Quality Checks & Unit Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install --upgrade ruff

      - name: Ruff Version
        run: |
          ruff --version

      - name: Clean up
        run: |
          rm -rf /tmp/* || true

      - name: Ruff Lint
        run: |
          ruff check src/train.py src/evaluate.py --output-format=github || true
        # Ignore errors from ruff

      - name: Ruff Format Validation
        run: |
          ruff format . --check

      - name: Run Unit Tests
        run: |
          pytest -q

  dependency_security:

    name: Dependency Vulnerability Scan

    runs-on: ubuntu-latest

    needs: code_quality

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Dependencies
        run: |
          pip-audit -r requirements.txt

  secret_scan:

    name: Secret Detection Scan

    runs-on: ubuntu-latest

    needs: code_quality

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

  docker_build:

    name: Docker Image Build & Validation

    runs-on: ubuntu-latest

    needs:
      - dependency_security
      - secret_scan

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build --no-cache -t churn-mlops .

      - name: Verify Container Starts
        run: |
          docker run --rm churn-mlops python --version

  docker_compose:

    name: Docker Compose Services Validation

    runs-on: ubuntu-latest

    needs:
      - docker_build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Dummy Dataset
        run: |
          mkdir -p data

      - name: Build Compose Services
        run: |
          docker compose build

      - name: Validate Tests Container
        run: |
          docker compose run --rm tests

      - name: Cleanup
        if: always()
        run: |
          docker compose down --remove-orphans

  mlops_validation:

    name: MLOps Infrastructure Validation

    runs-on: ubuntu-latest

    needs:
      - docker_compose

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Configure Kaggle Credentials
        run: |
          mkdir -p ~/.kaggle

          cat > ~/.kaggle/kaggle.json << EOF
          {
            "username":"${{ secrets.KAGGLE_USERNAME }}",
            "key":"${{ secrets.KAGGLE_KEY }}"
          }
          EOF

          chmod 600 ~/.kaggle/kaggle.json

      - name: Download Dataset
        run: |
          mkdir -p data

          kaggle datasets download \
            blastchar/telco-customer-churn \
            -p data

          unzip -o data/*.zip -d data

          mv data/WA_Fn-UseC_-Telco-Customer-Churn.csv data/raw.csv

      - name: Verify Dataset
        run: |
          ls -lah data
          test -f data/raw.csv

      - name: Create Runtime Directories
        run: |
          mkdir -p models
          mkdir -p artifacts
          mkdir -p mlflow

      - name: Build Docker Services
        run: |
          docker compose build

      - name: Start MLflow
        run: |
          docker compose up -d mlflow

      - name: Wait for MLflow
        run: |
          for i in {1..60}; do

            if curl -sf http://localhost:5000 >/dev/null; then
              echo "✅ MLflow is ready"
              exit 0
            fi

            echo "Waiting for MLflow..."
            sleep 2

          done

          echo "❌ MLflow startup timeout"
          exit 1

      - name: Show Running Containers
        run: |
          docker compose ps

      - name: Train Logistic Regression
        run: |
          docker compose run --rm train-logreg

      - name: Verify Logistic Regression Model
        run: |
          test -f models/logreg.pkl

      - name: Evaluate Logistic Regression
        run: |
          docker compose run --rm evaluate-logreg

      - name: Verify Evaluation Artifacts
        run: |
          ls -lah artifacts

      - name: Display MLflow Logs
        if: always()
        run: |
          docker compose logs mlflow --tail=200

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans