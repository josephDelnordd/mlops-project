[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-classifier"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.ruff.lint]
ignore = [
    "F401",  # Unused import
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
