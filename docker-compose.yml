x-common: &common
  build: .

  env_file:
    - .env

  environment:
    PYTHONPATH: /app
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME}

  volumes:
    - .:/app
    - ./data:/app/data
    - ./models:/app/models
    - ./artifacts:/app/artifacts

services:

  mlflow:

    image: ghcr.io/mlflow/mlflow:latest

    container_name: mlflow

    ports:
      - "5000:5000"

    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

    volumes:
      - ./mlflow:/mlflow

    restart: unless-stopped

  train-logreg:

    <<: *common

    depends_on:
      - mlflow

    command: >
      python -m src.train
      --config configs/logreg.yaml

  train-random-forest:

    <<: *common

    depends_on:
      - mlflow

    command: >
      python -m src.train
      --config configs/random_forest.yaml

  evaluate-logreg:

    <<: *common

    depends_on:
      - mlflow

    command: >
      python -m src.evaluate
      --config configs/logreg.yaml

  evaluate-random-forest:

    <<: *common

    depends_on:
      - mlflow

    command: >
      python -m src.evaluate
      --config configs/random_forest.yaml

  tests:

    <<: *common

    command: pytest -q

  lint:

    <<: *common

    command: ruff check .

  format:

    <<: *common

    command: >
      sh -c "ruff check . --fix && ruff format ."